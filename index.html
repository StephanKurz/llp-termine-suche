<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termin Suche in allen Kalendern</title>
<style>
  :root {
    --blue: #2f5fa8;
    --border: #d7dce3;
    --bg: #f7f8fa;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  #app { max-width: 720px; margin: 0 auto; padding: 22px 20px 40px; }
  h1 { font-size: 17px; margin: 0 0 14px; }

  #search-row { display: flex; gap: 8px; }
  #search-input {
    flex: 1; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px;
  }
  #search-btn {
    padding: 10px 18px; border: none; border-radius: 6px;
    background: var(--blue); color: #fff; font-size: 14px; cursor: pointer;
  }
  #search-btn:disabled { opacity: 0.6; cursor: default; }

  #options-row { margin-top: 10px; }
  #options-row label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); cursor: pointer;
  }

  #hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  #error { color: var(--danger); font-size: 13px; margin-top: 10px; }

  #results { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .result {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px;
  }
  .result .name-row {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 4px;
  }
  .result .name { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; }
  .result .name a { color: var(--text); text-decoration: none; }
  .result .name a:hover { color: var(--blue); text-decoration: underline; }
  .result.canceled .name { text-decoration: line-through; color: var(--muted); }
  .result .calendar-name {
    flex: 0 0 auto; max-width: 40%; text-align: right;
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .result .meta { font-size: 12.5px; color: var(--muted); }
  .result .badge {
    display: inline-block; margin-left: 8px; font-size: 11px;
    color: var(--danger); border: 1px solid var(--danger); border-radius: 4px;
    padding: 1px 5px;
  }

  .participation-toggle {
    display: inline-block; margin-top: 6px;
    font-size: 12px; color: var(--blue); cursor: pointer; user-select: none;
  }
  .participation-toggle:hover { text-decoration: underline; }
  .participation-toggle.disabled { color: var(--muted); cursor: default; }
  .participation-toggle.disabled:hover { text-decoration: none; }
  .participation-box {
    margin-top: 6px; font-size: 12.5px; color: var(--text);
    background: var(--bg); border-radius: 6px; padding: 6px 8px;
  }
  .participation-box .total { font-weight: 600; margin-bottom: 2px; }
  .participation-box .breakdown-item { color: var(--muted); }
  .participation-box .state-heading {
    font-weight: 600; margin-top: 6px; color: var(--text);
  }
  .participation-box .state-heading:first-of-type { margin-top: 2px; }
  .participation-box .participant-name { color: var(--text); padding-left: 4px; }

  #load-more-row { text-align: center; margin-top: 14px; }
  #load-more-btn {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--text); font-size: 13px; cursor: pointer;
  }
  #load-more-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <h1>Termin Suche in allen Kalendern</h1>
  <div id="search-row">
    <input id="search-input" type="text" placeholder="Termin oder Stichwort eingeben … (oder * für alle Termine)" autocomplete="off">
    <button id="search-btn">Suchen</button>
  </div>
  <div id="options-row">
    <label><input type="checkbox" id="future-checkbox"> Auch künftige Termine anzeigen</label>
  </div>
  <div id="hint">Bitte einen Suchbegriff eingeben – durchsucht wird Titel, Ort, Beschreibung und Notiz aller Termine. Mit * werden alle Termine angezeigt.</div>
  <div id="error" hidden></div>
  <div id="results"></div>
  <div id="load-more-row" hidden>
    <button id="load-more-btn">Weitere Treffer laden</button>
  </div>
</div>

<script>
  const SEARCH_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1/search-events";
  const PARTICIPATION_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1/event-participation";
  const PARTICIPANTS_URL = "https://cclcdhwnzkzciwjaclzt.supabase.co/functions/v1/event-participants";
  const EV_ORG_SLUG = "LLP";
  function eventUrl(id) { return `https://easyverein.com/public/${EV_ORG_SLUG}/calendar/${id}`; }

  const input = document.getElementById("search-input");
  const btn = document.getElementById("search-btn");
  const futureCheckbox = document.getElementById("future-checkbox");
  const hint = document.getElementById("hint");
  const errorBox = document.getElementById("error");
  const resultsBox = document.getElementById("results");
  const loadMoreRow = document.getElementById("load-more-row");
  const loadMoreBtn = document.getElementById("load-more-btn");

  let currentQuery = "";
  let currentPage = 1;

  function formatDateTime(startIso, endIso, allDay) {
    const start = new Date(startIso);
    const datePart = start.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
    if (allDay) return datePart + " – ganztägig";
    const timePart = start.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    return `${datePart}, ${timePart} Uhr`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function loadParticipationCount(eventId, toggleEl) {
    try {
      const resp = await fetch(`${PARTICIPATION_URL}?eventId=${eventId}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");

      toggleEl.dataset.total = String(data.total);
      if (data.total === 0) {
        toggleEl.textContent = "Keine Teilnehmer";
        toggleEl.classList.add("disabled");
      } else {
        toggleEl.textContent = `${data.total} Teilnehmer anzeigen`;
      }
    } catch (e) {
      toggleEl.textContent = "Teilnehmer anzeigen";
    }
  }

  function renderParticipantsBox(data) {
    if (data.total === 0) {
      return `<span class="breakdown-item">Keine Teilnahmen hinterlegt.</span>`;
    }
    let html = `<div class="total">${data.total} Teilnahme(n) insgesamt</div>`;
    let lastLabel = null;
    for (const p of data.participants) {
      if (p.label !== lastLabel) {
        html += `<div class="state-heading">${escapeHtml(p.label)}</div>`;
        lastLabel = p.label;
      }
      const displayName = (p.name || "(ohne Namen hinterlegt)") + (p.comment ? ` (${p.comment})` : "");
      html += `<div class="participant-name">${escapeHtml(displayName)}</div>`;
    }
    return html;
  }

  async function toggleParticipation(eventId, boxEl, toggleEl) {
    if (toggleEl.classList.contains("disabled")) return;

    if (boxEl.dataset.loaded === "1") {
      boxEl.hidden = !boxEl.hidden;
      toggleEl.textContent = boxEl.hidden ? `${toggleEl.dataset.total} Teilnehmer anzeigen` : "Teilnehmer ausblenden";
      return;
    }
    const savedLabel = toggleEl.textContent;
    toggleEl.textContent = "Lädt …";
    try {
      const resp = await fetch(`${PARTICIPANTS_URL}?eventId=${eventId}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");

      boxEl.innerHTML = renderParticipantsBox(data);
      boxEl.dataset.loaded = "1";
      boxEl.hidden = false;
      toggleEl.textContent = "Teilnehmer ausblenden";
    } catch (e) {
      toggleEl.textContent = savedLabel;
      boxEl.hidden = false;
      boxEl.innerHTML = `<span class="breakdown-item" style="color: var(--danger)">Fehler: ${escapeHtml(e.message)}</span>`;
      boxEl.dataset.loaded = "1";
    }
  }

  function renderResults(events, append) {
    if (!append) resultsBox.innerHTML = "";
    for (const ev of events) {
      const el = document.createElement("div");
      el.className = "result" + (ev.canceled ? " canceled" : "");
      const meta = formatDateTime(ev.start, ev.end, ev.allDay) + (ev.location ? " · " + ev.location : "");
      const calendarBadge = ev.calendarName
        ? `<div class="calendar-name" style="color: ${escapeHtml(ev.calendarColor || "var(--muted)")}" title="${escapeHtml(ev.calendarName)}">${escapeHtml(ev.calendarName)}</div>`
        : "";
      el.innerHTML =
        `<div class="name-row">` +
          `<div class="name"><a href="${eventUrl(ev.id)}" target="_blank" rel="noopener">${escapeHtml(ev.name)}</a>${ev.canceled ? '<span class="badge">abgesagt</span>' : ""}</div>` +
          calendarBadge +
        `</div>` +
        `<div class="meta">${escapeHtml(meta)}</div>` +
        `<div class="participation-toggle">Teilnehmer …</div>` +
        `<div class="participation-box" hidden></div>`;

      const toggleEl = el.querySelector(".participation-toggle");
      const boxEl = el.querySelector(".participation-box");
      toggleEl.addEventListener("click", () => toggleParticipation(ev.id, boxEl, toggleEl));
      loadParticipationCount(ev.id, toggleEl);

      resultsBox.appendChild(el);
    }
  }

  async function runSearch(page, append) {
    errorBox.hidden = true;
    btn.disabled = true;
    loadMoreBtn.disabled = true;
    try {
      const future = futureCheckbox.checked ? "1" : "0";
      const url = `${SEARCH_URL}?q=${encodeURIComponent(currentQuery)}&page=${page}&future=${future}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unbekannter Fehler.");

      renderResults(data.results, append);
      currentPage = page;

      if (!append && data.results.length === 0) {
        hint.textContent = "Keine Termine gefunden.";
        hint.hidden = false;
      } else {
        hint.hidden = true;
      }

      loadMoreRow.hidden = !data.hasMore;
    } catch (e) {
      errorBox.textContent = "Fehler bei der Suche: " + e.message;
      errorBox.hidden = false;
      if (!append) resultsBox.innerHTML = "";
      loadMoreRow.hidden = true;
    } finally {
      btn.disabled = false;
      loadMoreBtn.disabled = false;
    }
  }

  function startSearch() {
    const q = input.value.trim();
    if (!q) {
      resultsBox.innerHTML = "";
      loadMoreRow.hidden = true;
      errorBox.hidden = true;
      hint.textContent = "Bitte einen Suchbegriff eingeben – durchsucht wird Titel, Ort, Beschreibung und Notiz aller Termine. Mit * werden alle Termine angezeigt.";
      hint.hidden = false;
      return;
    }
    currentQuery = q;
    runSearch(1, false);
  }

  btn.addEventListener("click", startSearch);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") startSearch(); });
  loadMoreBtn.addEventListener("click", () => runSearch(currentPage + 1, true));
  futureCheckbox.addEventListener("change", () => { if (currentQuery) startSearch(); });
</script>
</body>
</html>
